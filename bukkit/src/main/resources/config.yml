# 动画播控的广播半径（格）。只有半径内、同世界的玩家会收到播控指令——
# 视距外的客户端收到也没有实体可播，纯属浪费带宽。
# 被播放动画的玩家本人无论距离都会收到。
# 设为 0 或负数则退回全服广播（不推荐，人数多时每秒可达数万包）。
animation-broadcast-radius: 96.0
