name: Lantern
main: org.lantern.LanternPlugin
depend:
  - AyCore
softdepend:
  - PlaceholderAPI
  - MythicMobs
version: ${version}
api-version: 1.20
commands:
  lantern:
    description: Lantern 管理命令。
    usage: /lantern [reload|open <界面ID> [玩家]|give <方块ID> [玩家] [数量]|anim play <动画名> [过渡tick] [loop|once]|anim stop <动画名> [过渡tick]|skill <玩家> <技能名>|cam info [玩家]|cam toggle [玩家]|cam set <offset-x|offset-y|distance> <值> [玩家]|cam lock <x> <y> <z> [平滑秒] [持续秒] [sync] [玩家]|cam lockentity [平滑秒] [持续秒] [sync] [玩家]|cam unlock [玩家]|cam shake [幅度] [频率] [时长秒] [玩家]|cam fov [度数] [过渡秒] [玩家]|cam offset <pitch> <yaw> [roll] [过渡秒] [玩家]|cam path <路径ID> [玩家] [速度]|cam watch <x> <y> <z> <看向x> <看向y> <看向z> [持续秒] [平滑秒] [玩家]|cam clear [玩家]|campath start <路径ID>|campath add [t] [linear|smooth|hold] [fov]|campath undo|clear|list|preview|play [速度]|save|stop|costume equip <玩家> <槽位> <装扮ID>|costume unequip <玩家> [槽位]|wardrobe [玩家]|bind <宿主UUID> <载体UUID> [x y z] [rotate] [visible] [毫秒]|unbind <载体UUID>|binds|lock <玩家> <动作,动作> <毫秒>|unlock <玩家>|image text <内容> [缩放]|image texture <贴图路径> [边长]|image spawn <模板名>|image clear]
permissions:
  lantern.*:
    description: Lantern 全部权限
    default: op
    children:
      lantern.reload: true
      lantern.open: true
      lantern.give: true
      lantern.anim: true
      lantern.skill: true
      lantern.camera: true
      lantern.costume: true
      lantern.wardrobe: true
      lantern.bind: true
      lantern.lock: true
      lantern.image: true
  lantern.reload:
    description: 重载全部配置并推送在线玩家
    default: op
  lantern.open:
    description: 打开 UI 界面
    default: op
  lantern.give:
    description: 给予自定义方块
    default: op
  lantern.anim:
    description: 播控动画与设置 molang 变量
    default: op
  lantern.skill:
    description: 对玩家施放 MythicMobs 技能
    default: op
  lantern.camera:
    description: 相机管理与运镜演出指令（越肩自用有客户端按键入口，不走命令）
    default: op
  lantern.costume:
    description: 为玩家装备或卸下装扮
    default: op
  lantern.wardrobe:
    description: 打开衣橱
    default: true
  lantern.bind:
    description: 载体绑定管理
    default: op
  lantern.lock:
    description: 玩家输入锁管理
    default: op
  lantern.image:
    description: 世界图片调试（生成/清空）
    default: op