name: Lantern
main: org.lantern.LanternPlugin
depend:
  - AyCore
softdepend:
  - PlaceholderAPI
  - MythicMobs
version: ${version}
api-version: 1.20
commands:
  lantern:
    description: Lantern management command.
    usage: /lantern [reload|open <screen-id> [player]|give <block-id> [player] [amount]|anim play <animation> [transition-ticks] [loop|once]|anim stop <animation> [transition-ticks]|costume equip <player> <slot> <costume-id>|costume unequip <player> [slot]|wardrobe [player]]