id: example_hud

styles:
  btn-primary:
    background: "#4a90d9"
    color: "#ffffff"
    width: 80
    height: 20
    border-radius: 3

root:
  type: panel
  style:
    x: 10
    y: 10
    width: 200
    height: 100
  children:
    - type: text
      text: "Hello World"
      style:
        color: "#ffffff"
        font-size: 12
        x: 5
        y: 5

    - type: button
      text: "Confirm"
      style-ref: btn-primary
      style:
        x: 60
        y: 70
      action: "close"
